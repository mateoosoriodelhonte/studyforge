name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI must never reach a live AI service. Providers are mocked in tests; this
  # makes an accidental real call fail loudly rather than silently succeed.
  AI_PROVIDER: none
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Migrations on a clean database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install
      - run: uv sync --group dev --locked

      - name: Upgrade a fresh database to head
        run: uv run alembic upgrade head

      - name: Models and migrations agree (no un-migrated drift)
        run: uv run alembic check

      - name: Downgrade to base and back up again
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Application starts against the migrated database
        run: |
          uv run studyforge serve --port 8123 &
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8123/healthz; then echo; exit 0; fi
            sleep 0.5
          done
          echo "application did not become healthy in time" >&2
          exit 1

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install
      - run: uv sync --group dev --group e2e --locked

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      # `--with-deps` shells out to apt every time, even when the browser is
      # already cached — and an Ubuntu mirror stalling there once hung this job
      # for half an hour. Only touch apt when the browser actually needs
      # downloading; the job timeout catches it if that stalls too.
      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: uv run playwright install --with-deps chromium

      - name: Install Chromium (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: uv run playwright install chromium

      - name: Run the critical-path tests
        run: uv run pytest tests/e2e -v

  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t studyforge:ci .

      - name: It starts, migrates and serves
        run: |
          docker run -d --name studyforge-ci -p 8000:8000 studyforge:ci
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo
              docker rm -f studyforge-ci
              exit 0
            fi
            sleep 1
          done
          echo "the container did not become healthy in time" >&2
          docker logs studyforge-ci
          exit 1

  security:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install

      - name: Export runtime dependencies
        # NO_COLOR matters: the workflow sets FORCE_COLOR=1, and uv would
        # otherwise write ANSI escapes into the file that pip-audit then
        # fails to parse.
        env:
          NO_COLOR: "1"
          FORCE_COLOR: ""
        run: uv export --no-dev --no-emit-project --format requirements-txt -o requirements.audit.txt

      - name: Audit for known vulnerabilities
        run: uvx pip-audit --strict --disable-pip -r requirements.audit.txt
