[project]
name = "studyforge"
version = "1.0.0"
description = "A local-first intelligent study system: ingest notes, extract concepts, and drill them with FSRS-6 spaced repetition."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Mateo Osorio Delhonte" }]
keywords = ["spaced-repetition", "fsrs", "flashcards", "study", "fastapi", "htmx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "pypdf>=5.1",
    "itsdangerous>=2.2",
    "httpx2>=2.12.0",
]

[project.urls]
Homepage = "https://github.com/mateoosoriodelhonte/studyforge"
Repository = "https://github.com/mateoosoriodelhonte/studyforge"
Issues = "https://github.com/mateoosoriodelhonte/studyforge/issues"

[project.scripts]
studyforge = "studyforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
]
e2e = ["playwright>=1.49", "pytest-playwright>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studyforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "PTH",           # use pathlib
    "RUF",           # ruff-specific
    "S",             # bandit security
    "T20",           # no print
    "ARG",           # unused arguments
    "TID",           # tidy imports
    "BLE",           # no blind except
]
ignore = [
    "S101",  # assert is fine (pytest, and internal invariants)
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ARG001", "ARG002"]
"migrations/**" = ["N999", "ARG001"]
"src/studyforge/cli.py" = ["T20"]
# Operator-facing verification tools; their entire output is stdout.
"scripts/**" = ["T20"]
# RUF001 flags "ambiguous" Unicode characters. Folding exactly those characters
# is what this module is for, and the tests must contain the real ones.
# S608 flags interpolating identifiers into SQL. SQL identifiers cannot be
# bound as parameters, and every value interpolated in this module comes from a
# module-level constant — no user input reaches it. See the module docstring.
"src/studyforge/fts.py" = ["S608"]
"src/studyforge/domain/text/normalize.py" = ["RUF001"]
"tests/unit/test_normalize.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["studyforge"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["studyforge"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
# The browser tests are excluded from the default run: they need a live server
# and an installed Chromium, and they are an order of magnitude slower. Run them
# explicitly with `pytest tests/e2e`; CI runs them as their own job.
testpaths = ["tests/unit", "tests/integration", "tests/security"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: browser end-to-end tests (require `playwright install`)",
]
filterwarnings = ["error", "ignore::DeprecationWarning:passlib.*"]

[tool.coverage.run]
source = ["src/studyforge"]
omit = ["*/migrations/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
